<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBA 全日制集中班课程表</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --core:#2563eb;--core-bg:#eff6ff;--core-border:#bfdbfe;
  --required:#0f766e;--required-bg:#f0fdfa;--required-border:#99f6e4;
  --elective:#15803d;--elective-bg:#f0fdf4;--elective-border:#bbf7d0;
  --mandatory:#b45309;--mandatory-bg:#fffbeb;--mandatory-border:#fde68a;
  --summer:#d97706;--summer-bg:#fff7ed;--summer-border:#fed7aa;
  --conflict:#dc2626;--conflict-bg:#fef2f2;--conflict-border:#fecaca;
  --pair1:#7c3aed;--pair2:#0891b2;--pair3:#be185d;--pair4:#4d7c0f;--pair5:#c2410c;--pair6:#1e40af;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:14px;-webkit-font-smoothing:antialiased}

header{background:#0f172a;color:#fff;padding:20px 24px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.3)}
header .header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
header .badge{font-size:12px;color:var(--text3);font-weight:400}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:8px;padding:3px}
.tab{background:transparent;border:none;color:#94a3b8;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;white-space:nowrap}
.tab:hover{color:#e2e8f0}
.tab.active{background:#1e293b;color:#fff}

main{max-width:1400px;margin:0 auto;padding:24px}
.semester{display:none}
.semester.active{display:block}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.summary .sc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.summary .sc .num{font-size:28px;font-weight:700;line-height:1}
.summary .sc .lbl{font-size:12px;color:var(--text2);margin-top:4px}

.section{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overflow:hidden}
.section-head{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600}
.section-body{padding:20px}

.week-grid{display:grid;grid-template-columns:100px repeat(4,1fr);gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.wg-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px 10px;min-height:56px;font-size:12px}
.wg-cell:nth-child(5n+1){background:#f8fafc;font-weight:600;color:var(--text2)}
.wg-head{background:#1e293b!important;color:#fff!important;font-weight:600!important;text-align:center;font-size:13px}
.course-block{border-radius:6px;padding:6px 8px;margin:2px 0;font-size:12px;cursor:default;transition:transform .15s;border:1px solid}
.course-block:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cb-core{background:var(--core-bg);border-color:var(--core-border);color:var(--core)}
.cb-required{background:var(--required-bg);border-color:var(--required-border);color:var(--required)}
.cb-elective{background:var(--elective-bg);border-color:var(--elective-border);color:var(--elective)}
.cb-mandatory{background:var(--mandatory-bg);border-color:var(--mandatory-border);color:var(--mandatory)}
.cb-name{font-weight:600;display:block;margin-bottom:1px}
.cb-meta{font-size:11px;opacity:.8}

.evening-day{margin-bottom:24px}
.evening-day-title{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:6px}
.conflict-group{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:stretch;margin-bottom:10px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.cg-course{padding:14px 16px;flex:1}
.cg-vs{display:flex;align-items:center;justify-content:center;padding:0 16px;background:var(--conflict-bg);color:var(--conflict);font-weight:700;font-size:13px;letter-spacing:.05em;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.cg-course .cgc-name{font-weight:600;font-size:14px;margin-bottom:4px}
.cg-course .cgc-code{font-size:11px;color:var(--text3);font-family:monospace}
.cg-course .cgc-meta{font-size:12px;color:var(--text2);margin-top:4px}
.cgc-teacher{font-size:12px;color:var(--text2)}
.cgc-room{font-size:11px;color:var(--text3)}

[data-pair="1"]{border-left:3px solid var(--pair1)}
[data-pair="1"] .cg-vs{background:#f5f3ff;color:var(--pair1)}
[data-pair="2"]{border-left:3px solid var(--pair2)}
[data-pair="2"] .cg-vs{background:#ecfeff;color:var(--pair2)}
[data-pair="3"]{border-left:3px solid var(--pair3)}
[data-pair="3"] .cg-vs{background:#fdf2f8;color:var(--pair3)}
[data-pair="4"]{border-left:3px solid var(--pair4)}
[data-pair="4"] .cg-vs{background:#f7fee7;color:var(--pair4)}
[data-pair="5"]{border-left:3px solid var(--pair5)}
[data-pair="5"] .cg-vs{background:#fff7ed;color:var(--pair5)}
[data-pair="6"]{border-left:3px solid var(--pair6)}
[data-pair="6"] .cg-vs{background:#eff6ff;color:var(--pair6)}

.cg-multi{display:flex;align-items:stretch;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px}
.cg-multi .cg-course{flex:1;border-right:1px solid var(--border)}
.cg-multi .cg-course:last-child{border-right:none}
.cg-multi .cg-vs{flex-direction:column;padding:14px 12px}

.summer-banner{background:var(--summer-bg);border:1px solid var(--summer-border);border-radius:10px;padding:14px 20px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--summer)}
.summer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.summer-card{background:var(--summer-bg);border:1px solid var(--summer-border);border-radius:10px;padding:14px}
.summer-card .sc-name{font-weight:600;color:var(--summer);font-size:14px;margin-bottom:4px}
.summer-card .sc-meta{font-size:12px;color:var(--text2)}

.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s}
.filter-btn:hover{border-color:var(--text3)}
.filter-btn.active{background:#1e293b;color:#fff;border-color:#1e293b}
.course-table{width:100%;border-collapse:collapse;font-size:13px}
.course-table th{text-align:left;padding:10px 12px;background:#f8fafc;border-bottom:2px solid var(--border);font-weight:600;color:var(--text2);font-size:12px;white-space:nowrap;position:sticky;top:0}
.course-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.course-table tr:hover{background:#f8fafc}
.type-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.type-tag.core{background:var(--core-bg);color:var(--core)}
.type-tag.required{background:var(--required-bg);color:var(--required)}
.type-tag.elective{background:var(--elective-bg);color:var(--elective)}
.type-tag.mandatory{background:var(--mandatory-bg);color:var(--mandatory)}
.type-tag.summer{background:var(--summer-bg);color:var(--summer)}
.course-table .c-name{font-weight:600}
.course-table .c-code{font-family:monospace;font-size:11px;color:var(--text3)}
.course-table .c-time{font-size:12px;line-height:1.5}

.phase-badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:600;margin-bottom:8px}
.phase-1{background:#eff6ff;color:#1d4ed8}
.phase-2{background:#f0fdf4;color:#15803d}

.notes{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#92400e}
.notes ul{list-style:none;padding:0}
.notes li{padding:2px 0}
.notes li::before{content:"! ";font-weight:700;opacity:.7}

.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;color:var(--text2)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:12px;height:12px;border-radius:3px;border:1px solid}

@media(max-width:768px){
  header .header-inner{flex-direction:column;align-items:stretch}
  .tabs{overflow-x:auto}
  .week-grid{grid-template-columns:70px repeat(2,1fr)}
  .wg-col-wed,.wg-col-fri{display:none}
  .conflict-group{grid-template-columns:1fr;grid-template-rows:auto auto auto}
  .cg-vs{border-left:none;border-right:none;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px}
  .cg-multi{flex-direction:column}
  .cg-multi .cg-course{border-right:none;border-bottom:1px solid var(--border)}
}
</style>
</head>

const typeMap = {"核心课":"core","必修课":"required","选修课":"elective","必选课":"mandatory","暑期课":"summer"};

function renderCourseBlock(cell) {
  if (!cell) return '';
  return '<div class="course-block cb-'+cell.cls+'"><span class="cb-name">'+cell.n+'</span><span class="cb-meta">'+cell.t+' - '+cell.c+'</span></div>';
}

function renderWeekGrid(schedule) {
  var days = ["thu","fri","sat","sun"];
  var html = '<div class="week-grid">';
  html += '<div class="wg-cell wg-head">'+schedule.headers[0]+'</div>';
  for (var i=1;i<schedule.headers.length;i++) {
    html += '<div class="wg-cell wg-head">'+schedule.headers[i]+'</div>';
  }
  schedule.rows.forEach(function(row) {
    html += '<div class="wg-cell">'+row.time+'</div>';
    days.forEach(function(d) {
      var cell = row.cells[d];
      html += '<div class="wg-cell">'+renderCourseBlock(cell)+'</div>';
    });
  });
  html += '</div>';
  return html;
}

function renderConflictGroup(group) {
  if (group.pair === 0) {
    var c = group.courses[0];
    return '<div class="conflict-group" style="grid-template-columns:1fr"><div class="cg-course"><div class="cgc-name">'+c.name+'</div><div class="cgc-code">'+c.code+' - '+c.credits+'学分</div><div class="cgc-meta">'+group.period+'</div><div class="cgc-teacher">教师：'+c.teacher+'</div><div class="cgc-room">教室：'+c.room+'</div>'+(c.note?'<div class="cgc-room">'+c.note+'</div>':'')+'</div></div>';
  }
  if (group.courses.length > 2) {
    var coursesHtml = '';
    group.courses.forEach(function(c) {
      coursesHtml += '<div class="cg-course"><div class="cgc-name">'+c.name+'</div><div class="cgc-code">'+c.code+' - '+c.credits+'学分</div><div class="cgc-teacher">教师：'+c.teacher+'</div><div class="cgc-room">教室：'+c.room+'</div>'+(c.note?'<div class="cgc-room">'+c.note+'</div>':'')+'</div>';
    });
    return '<div class="cg-multi" data-pair="'+group.pair+'">'+coursesHtml+'<div class="cg-vs">多选一</div></div>';
  }
  var a = group.courses[0], b = group.courses[1];
  return '<div class="conflict-group" data-pair="'+group.pair+'"><div class="cg-course"><div class="cgc-name">'+a.name+'</div><div class="cgc-code">'+a.code+' - '+a.credits+'学分</div><div class="cgc-meta">'+group.period+'</div><div class="cgc-teacher">教师：'+a.teacher+'</div><div class="cgc-room">教室：'+a.room+'</div>'+(a.note?'<div class="cgc-room">'+a.note+'</div>':'')+'</div><div class="cg-vs">二选一</div><div class="cg-course"><div class="cgc-name">'+b.name+'</div><div class="cgc-code">'+b.code+' - '+b.credits+'学分</div><div class="cgc-meta">'+group.period+'</div><div class="cgc-teacher">教师：'+b.teacher+'</div><div class="cgc-room">教室：'+b.room+'</div>'+(b.note?'<div class="cgc-room">'+b.note+'</div>':'')+'</div></div>';
}

  d.allCourses.forEach(function(c) {
    var tc = typeMap[c.type]||"elective";
    html += '<tr data-type="'+c.type+'"><td>'+c.no+'</td><td class="c-code">'+c.code+'</td><td class="c-name">'+c.name+'</td><td><span class="type-tag '+tc+'">'+c.type+'</span></td><td>'+c.credits+'</td><td>'+c.teacher+'</td><td class="c-time">'+c.time+'</td><td>'+c.room+'</td></tr>';
  });
  html += '</tbody></table></div></div></div>';
  return html;
}

var app = document.getElementById("app");
function showSemester(sem) {
  app.innerHTML = '<div class="semester active">'+renderSemester(sem)+'</div>';
  bindFilters();
}
showSemester("fall2026");

document.querySelectorAll(".tab").forEach(function(tab) {
  tab.addEventListener("click", function() {
    document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
    tab.classList.add("active");
    showSemester(tab.dataset.sem);
  });
});

function bindFilters() {
  document.querySelectorAll(".filter-bar").forEach(function(bar) {
    var sem = bar.dataset.sem;
    var table = document.querySelector('.course-table[data-sem="'+sem+'"]');
    if (!table) return;
    bar.querySelectorAll(".filter-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        bar.querySelectorAll(".filter-btn").forEach(function(b){b.classList.remove("active");});
        btn.classList.add("active");
        var f = btn.dataset.filter;
        table.querySelectorAll("tbody tr").forEach(function(tr) {
          if (f === "all" || tr.dataset.type === f) { tr.style.display = ""; }
          else { tr.style.display = "none"; }
        });
      });
    });
  });
}
</script>
