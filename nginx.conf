# web 容器内 nginx:  serving HTML + /api 反代到同 compose 网络的 mba-api
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # 学习区首页（静态单文件，部署时写到 web/index.html）
    location = / { try_files /index.html =404; }
    # 二级入口：不带斜杠也能直接打开
    location = /schedule { try_files /MBA-Schedule.html =404; }
    location = /accounting_study { try_files /accounting_study/index.html =404; }
    # 旧 /study 地址永久跳转
    location = /study { return 301 /accounting_study; }
    location = /study/handbook/ { return 301 /accounting_study/handbook/; }
    location = /study/handbook { return 301 /accounting_study/handbook/; }
    location ^~ /study/ { return 301 /accounting_study; }
    location / { try_files $uri $uri/ =404; }
    location /api/ {
        proxy_pass http://mba-api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
