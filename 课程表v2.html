<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBA 课程表 - 可视化日历</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --core:#2563eb;--core-bg:#eff6ff;--core-border:#93c5fd;
  --req:#0f766e;--req-bg:#f0fdfa;--req-border:#5eead4;
  --ele:#15803d;--ele-bg:#f0fdf4;--ele-border:#86efac;
  --man:#b45309;--man-bg:#fffbeb;--man-border:#fcd34d;
  --sum:#d97706;--sum-bg:#fff7ed;--sum-border:#fdba74;
  --hol:#ef4444;--hol-bg:#fef2f2;
  --sidebar-w:300px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased}

/* Header */
header{background:#0f172a;color:#fff;padding:14px 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.header-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{font-size:17px;font-weight:700;white-space:nowrap}
header .badge{font-size:11px;color:#64748b;font-weight:400;margin-left:8px}
.tabs{display:flex;gap:2px;background:rgba(255,255,255,.06);border-radius:8px;padding:3px}
.tab{background:transparent;border:none;color:#94a3b8;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.tab:hover{color:#cbd5e1}
.tab.active{background:#1e293b;color:#fff}

/* Layout */
main{display:flex;max-width:1600px;margin:0 auto;min-height:calc(100vh - 55px)}
.sidebar{width:var(--sidebar-w);flex-shrink:0;padding:16px;border-right:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - 55px);position:sticky;top:55px}
.cal-area{flex:1;padding:16px;min-width:0}

/* Month nav */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px}
.month-nav .mn-label{font-size:17px;font-weight:700;text-align:center;flex:1}
.month-nav button{background:var(--card);border:1px solid var(--border);border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--text2);transition:all .15s;display:flex;align-items:center;justify-content:center}
.month-nav button:hover{background:#e2e8f0;border-color:var(--text3)}
.month-nav button:disabled{opacity:.3;cursor:not-allowed}

/* Conflict panel */
.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.panel-head{padding:10px 14px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.panel-body{padding:10px 14px}
.conflict-group{margin-bottom:12px}
.conflict-group:last-child{margin-bottom:0}
.cg-label{font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500}
.cg-options{display:flex;flex-direction:column;gap:4px}
.cg-opt{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;border:1px solid transparent;transition:all .12s}
.cg-opt:hover{background:#f8fafc}
.cg-opt.selected{border-color:var(--core);background:var(--core-bg);color:var(--core)}
.cg-opt.unselected{opacity:.4;text-decoration:line-through}
.cg-opt .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1.5px solid}
.cg-opt .dot.core{border-color:var(--core);background:var(--core)}
.cg-opt .dot.ele{border-color:var(--ele);background:var(--ele)}
.cg-clear{font-size:11px;color:var(--text3);cursor:pointer;margin-top:4px;text-decoration:underline}
.cg-clear:hover{color:var(--text2)}

/* Filter */
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:12px;color:var(--text2);transition:all .12s}
.filter-btn:hover{border-color:var(--text3)}
.filter-btn.active{background:#1e293b;color:#fff;border-color:#1e293b}

/* Legend */
.legend{display:flex;flex-direction:column;gap:5px}
.legend-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:2px;border:1px solid}

/* Unscheduled */
.unsched{font-size:11px;color:var(--text3);padding:4px 0;line-height:1.6}
.unsched div{padding:2px 0;border-bottom:1px dotted var(--border)}

/* Calendar */
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.cal-wd{text-align:center;font-size:12px;font-weight:600;color:var(--text2);padding:6px 0}
.cal-wd.weekend{color:var(--hol)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{border:1px solid var(--border);border-radius:4px;min-height:140px;padding:4px;background:var(--card);display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:border-color .15s}
.cal-cell.other{background:#f8fafc;border-color:#f1f5f9}
.cal-cell.today{border:2px solid var(--core)}
.cal-cell.holiday{background:var(--hol-bg)}
.cal-cell.has-conflict{border-color:#fbbf24;border-style:dashed}
.cal-date{font-size:11px;font-weight:600;color:var(--text2);text-align:right;padding:0 3px;flex-shrink:0}
.cal-date .hol-name{font-size:9px;color:var(--hol);font-weight:400}
.cal-courses{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1}
.cal-courses::-webkit-scrollbar{width:3px}
.cal-courses::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}

.cc{border-left:3px solid;border-radius:3px;padding:3px 6px;font-size:12px;cursor:pointer;transition:all .12s;line-height:1.35}
.cc:hover{filter:brightness(.97);transform:translateX(1px)}
.cc-core{border-color:var(--core);background:var(--core-bg);color:#1e40af}
.cc-req{border-color:var(--req);background:var(--req-bg);color:#115e59}
.cc-ele{border-color:var(--ele);background:var(--ele-bg);color:#166534}
.cc-man{border-color:var(--man);background:var(--man-bg);color:#92400e}
.cc-sum{border-color:var(--sum);background:var(--sum-bg);color:#9a3412}
.cc-conflict{border-style:dashed;border-width:2px}
.cc-name{font-weight:600;line-height:1.25;word-break:break-word}
.cc-time{opacity:.65;font-size:10px}
.cc-conflict-badge{display:inline-block;font-size:9px;background:#f59e0b;color:#fff;border-radius:2px;padding:0 4px;margin-left:3px;vertical-align:middle;white-space:nowrap}

/* Empty day */
.cal-empty{font-size:10px;color:var(--text3);text-align:center;padding:4px;opacity:.5}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;padding:0}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);padding:0 4px;line-height:1}
.modal-body{padding:16px 20px}
.modal-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #f1f5f9}
.modal-row:last-child{border-bottom:none}
.modal-row .mr-label{font-size:12px;color:var(--text3);width:70px;flex-shrink:0}
.modal-row .mr-val{font-size:13px;color:var(--text);flex:1}
.modal-dates{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.8}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:8px 20px;border-radius:8px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

/* Stats */
.stats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;flex:1;min-width:70px;text-align:center}
.stat .sn{font-size:20px;font-weight:700;line-height:1}
.stat .sl{font-size:10px;color:var(--text3);margin-top:2px}

/* Mobile */
.mobile-toggle{display:none}
@media(max-width:900px){
  :root{--sidebar-w:100%}
  main{flex-direction:column}
  .sidebar{position:fixed;bottom:0;left:0;right:0;max-height:50vh;border-right:none;border-top:1px solid var(--border);z-index:90;transform:translateY(calc(100% - 44px));transition:transform .3s}
  .sidebar.open{transform:translateY(0)}
  .mobile-toggle{display:flex;position:fixed;bottom:0;left:0;right:0;background:#1e293b;color:#fff;padding:10px 16px;justify-content:center;align-items:center;gap:8px;z-index:95;font-size:13px;cursor:pointer}
  .mobile-toggle .arrow{transition:transform .3s}
  .mobile-toggle .arrow.up{transform:rotate(180deg)}
  .cal-area{padding:8px}
  .cal-cell{min-height:90px}
  .cc{font-size:10px;padding:2px 4px}
  .cc-time{display:none}
}

.sidebar-toggle{position:fixed;left:var(--sidebar-w);top:55px;z-index:95;background:#1e293b;color:#fff;border:none;border-radius:0 6px 6px 0;width:22px;height:48px;cursor:pointer;font-size:13px;transition:left .2s;display:flex;align-items:center;justify-content:center;box-shadow:2px 0 6px rgba(0,0,0,.1)}
.sidebar-toggle:hover{background:#334155}
main.collapsed .sidebar{display:none}
main.collapsed .sidebar-toggle{left:0}
.export-btn{width:100%;padding:9px;background:#1e293b;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:12px;font-weight:500;transition:background .15s}
.export-btn:hover{background:#334155}
@media print{
  @page{size:A3 landscape;margin:10mm}
  header,.sidebar,.cal-area,.mobile-toggle,.modal-overlay,.toast,.sidebar-toggle{display:none!important}
  #printContainer{display:block!important}
  .print-header{text-align:center;margin-bottom:14px}
  .print-header h1{font-size:24px;font-weight:700}
  .print-header p{font-size:13px;color:#475569;margin-top:4px}
  .print-legend{margin-top:8px;font-size:12px}
  .print-legend span{margin-right:12px}
  .print-month{page-break-after:always}
  .print-month:last-child{page-break-after:auto}
  .print-month-title{font-size:18px;font-weight:700;margin:10px 0 6px}
  .print-cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
  .print-cal-wd{text-align:center;font-size:13px;font-weight:600;color:#475569;padding:6px 0}
  .print-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .print-cal-grid .cal-cell{min-height:120px!important;overflow:visible!important}
  .print-cal-grid .cc{font-size:11px!important}
  .print-cal-grid .cc-name{font-size:11px!important}
  .print-cal-grid .cc-time{font-size:10px!important}
}

.sel-progress{margin-bottom:10px}
.sel-progress .sp-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;align-items:baseline}
.sel-progress .sp-num{font-weight:700;color:var(--core);font-size:14px}
.sel-progress .sp-bar{height:10px;background:#e2e8f0;border-radius:5px;overflow:hidden}
.sel-progress .sp-fill{height:100%;background:linear-gradient(90deg,#2563eb,#0891b2);border-radius:5px;transition:width .3s}
.sel-summary{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.sel-summary .ss-item{font-size:11px;padding:3px 8px;border-radius:4px;background:#f8fafc;border:1px solid var(--border);white-space:nowrap}
.sel-overview{margin-bottom:10px}
.sel-overview-total{margin-bottom:10px}
.sel-overview-total .sp-bar{height:16px;border-radius:8px}
.sel-breakdown{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.sel-cat{display:grid;grid-template-columns:110px 1fr 50px;align-items:center;gap:6px;font-size:11px}
.sel-cat-label{display:flex;align-items:center;gap:4px;white-space:nowrap}
.sel-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sel-cat-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.sel-cat-fill{height:100%;border-radius:4px;transition:width .3s}
.sel-cat-num{text-align:right;font-weight:600;color:var(--text2);font-size:11px;white-space:nowrap}
.sel-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.sel-list::-webkit-scrollbar{width:3px}
.sel-list::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
.sel-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;font-size:12px;border:1px solid transparent}
.sel-item:hover{background:#f8fafc}
.sel-item.si-fixed{opacity:.6}
.sel-item.si-conflict-pending{background:#fffbeb;border-color:#fde68a}
.sel-item.si-conflict-selected{background:#eff6ff;border-color:#bfdbfe}
.sel-item input[type="checkbox"]{accent-color:var(--ele);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.sel-item.si-fixed input{accent-color:var(--text3)}
.sel-item .si-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-item .si-credit{font-size:11px;color:var(--text2);font-weight:600;flex-shrink:0;white-space:nowrap}
.sel-item .si-type{font-size:9px;padding:1px 4px;border-radius:3px;flex-shrink:0;white-space:nowrap}


.cl-table{width:100%;border-collapse:collapse;font-size:13px}
.cl-table th{text-align:left;padding:8px 10px;background:#f8fafc;border-bottom:2px solid var(--border);font-weight:600;color:var(--text2);font-size:12px;white-space:nowrap}
.cl-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.cl-table tr:hover{background:#f8fafc}
.cl-table .cl-name{font-weight:600}
.cl-table .cl-code{font-family:monospace;font-size:11px;color:var(--text3)}
.cl-table .cl-time{font-size:12px;line-height:1.5}
.cl-table .cl-summary{background:#f8fafc;font-weight:600}
.cl-table .cl-summary td{padding:6px 10px;font-size:12px;border-bottom:2px solid var(--border)}
.cl-empty{text-align:center;color:var(--text3);padding:20px;font-size:13px}

.slot-sep{border-top:1px dashed var(--border);margin:3px 0}
</style>
</head>

<header>
<div class="header-inner">
<h1>MBA 课程表 <span class="badge">可视化日历 v2</span></h1>
<nav class="tabs">

<main>

<div class="panel" id="conflictPanel" style="display:none">

<div class="filter-row" id="filterRow">

<button class="filter-btn" data-filter="core">核心课</button>
<button class="filter-btn" data-filter="req">必修课</button>
<button class="filter-btn" data-filter="ele">选修课</button>
<button class="filter-btn" data-filter="man">必选课</button>
<button class="filter-btn" data-filter="sum">暑期课</button>
</div>
</div>
</div>


</div>

<div class="panel" id="unschedPanel" style="display:none">

<div class="panel-body">
<div class="unsched" id="unschedList"></div>
</div>
</div>
</aside>

<div class="cal-area">
<div class="legend" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--text2)"><div class="legend-row"><div class="legend-dot" style="border-color:var(--core);background:var(--core-bg)"></div>核心课（含必修）</div><div class="legend-row"><div class="legend-dot" style="border-color:var(--man);background:var(--man-bg)"></div>必选课</div><div class="legend-row"><div class="legend-dot" style="border-color:var(--ele);background:var(--ele-bg)"></div>选修课</div><div class="legend-row"><div class="legend-dot" style="border-color:var(--sum);background:var(--sum-bg)"></div>暑期课</div><div class="legend-row"><div class="legend-dot" style="border-color:#f59e0b;background:#fef3c7"></div>冲突课（虚线）</div></div>
<div class="cal-weekdays">
<div class="cal-wd">周一</div>
<div class="cal-wd">周二</div>
<div class="cal-wd">周三</div>
<div class="cal-wd">周四</div>
<div class="cal-wd">周五</div>
<div class="cal-wd weekend">周六</div>
<div class="cal-wd weekend">周日</div>
</div>
<div class="cal-grid" id="calGrid"></div>
<div class="panel" id="courseListPanel" style="margin-top:16px">
<div class="panel-head">已选课程列表</div>
<div class="panel-body" id="courseListBody"></div>
</div>
</div>
</main>

<div class="mobile-toggle" id="mobileToggle">
<span>面板</span>
<span class="arrow" id="mobileArrow">&#9650;</span>
</div>

<div id="printContainer" style="display:none"></div>
<div class="modal-overlay" id="modalOverlay">
<div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

// ========== UTILS ==========
function fmtDate(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function parseISO(s){var p=s.split("-");return{y:+p[0],m:+p[1]-1,d:+p[2]}}
function expandWeekly(p){
  var res=[],start=new Date(p.start+"T00:00:00"),end=new Date(p.end+"T00:00:00");
  var exc=new Set(p.except||[]);
  var cur=new Date(start);
  while(cur<=end){
    if(cur.getDay()===p.dow&&!exc.has(fmtDate(cur.getFullYear(),cur.getMonth(),cur.getDate()))){
      res.push(fmtDate(cur.getFullYear(),cur.getMonth(),cur.getDate()));
    }
    cur.setDate(cur.getDate()+1);
  }
  return res;
}
function getSessionDates(session){
  if(session.dates) return session.dates;
  if(session.weekly) return expandWeekly(session.weekly);
  return [];
}
function getCourseById(sem,id){
  var courses=SEMESTERS[sem].courses;
  for(var i=0;i<courses.length;i++){if(courses[i].id===id) return courses[i];}
  return null;
}
function isCourseVisible(course){
  if(course.conflict){
    var sel=state.selections[course.conflict];
    if(sel&&sel!==course.id) return false;
  }
  if(isElectiveType(course.type) && !state.electiveSel[state.sem][course.id]) return false;
  if(state.filter!=="all"&&course.type!==state.filter) return false;
  return true;
}
var todayStr=fmtDate(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());

// ========== RENDER ==========
function getConflictBadge(c){
  if(!c.conflict) return '';
  var sem=SEMESTERS[state.sem];
  for(var i=0;i<sem.conflicts.length;i++){if(sem.conflicts[i].id===c.conflict){var n=sem.conflicts[i].courses.length;break;}}
  if(typeof n==="undefined") return '';
  var labels={2:'二选一',3:'三选一',4:'四选一'};
  return '<span class="cc-conflict-badge">'+(labels[n]||'多选一')+'</span>';
}

function getCoursesForDate(dateStr){
  var sem=SEMESTERS[state.sem];
  var results=[];
  for(var i=0;i<sem.courses.length;i++){
    var c=sem.courses[i];
    if(!isCourseVisible(c)) continue;
    for(var j=0;j<c.sessions.length;j++){
      var dates=getSessionDates(c.sessions[j]);
      if(dates.indexOf(dateStr)>=0){
        results.push({course:c,session:c.sessions[j]});
        break;
      }
    }
  }
  results.sort(function(a,b){return a.session.ts.localeCompare(b.session.ts)});
  return results;
}

function renderCalendar(){
  var y=state.year,m=state.month;
  var sem=SEMESTERS[state.sem];
  document.getElementById("monthLabel").textContent=y+"年"+(m+1)+"月";

  var firstDay=new Date(y,m,1);
  var firstDOW=firstDay.getDay(); // 0=Sun
  var mondayOffset=firstDOW===0?6:firstDOW-1;
  var daysInMonth=new Date(y,m+1,0).getDate();
  var grid=document.getElementById("calGrid");
  grid.innerHTML="";

  // Build cells
  var totalCells=Math.ceil((mondayOffset+daysInMonth)/7)*7;
  for(var i=0;i<totalCells;i++){
    var dayNum=i-mondayOffset+1;
    var cell=document.createElement("div");
    cell.className="cal-cell";
    if(dayNum<1||dayNum>daysInMonth){
      cell.className+=" other";
      cell.innerHTML='<div class="cal-date">&nbsp;</div>';
    }else{
      var ds=fmtDate(y,m,dayNum);
      var isToday=ds===todayStr;
      var holName=sem.holidays[ds];
      if(isToday) cell.className+=" today";
      if(holName) cell.className+=" holiday";

      var dateHtml='<div class="cal-date">'+dayNum;
      if(holName) dateHtml+=' <span class="hol-name">'+holName+'</span>';
      dateHtml+='</div>';

      var courses=getCoursesForDate(ds);
      var hasConflict=false;
      var coursesHtml='<div class="cal-courses">';
      if(holName&&!courses.length){
        coursesHtml+='<div class="cal-empty">'+holName+'停课</div>';
      }else if(courses.length){
        courses.sort(function(a,b){return a.session.ts.localeCompare(b.session.ts);});
        var lastSlot='';
        for(var k=0;k<courses.length;k++){
          var item=courses[k];
          var cs=item.session.ts;
          var slot=cs<"12:00"?"M":cs<"18:00"?"A":"E";
          if(k>0&&slot!==lastSlot) coursesHtml+='<div class="slot-sep"></div>';
          lastSlot=slot;
          var c=item.course;
          var cls="cc cc-"+c.type;
          if(c.conflict&&!state.selections[c.conflict]) cls+=" cc-conflict";
          if(c.conflict) hasConflict=true;
          var badge=getConflictBadge(c);
          coursesHtml+='<div class="'+cls+'" data-cid="'+c.id+'">'+
            '<div class="cc-name">'+c.name+badge+'</div>'+
            '<div class="cc-time">'+item.session.ts+"-"+item.session.te+" "+c.room+'</div>'+
            '</div>';
        }
      }
      coursesHtml+='</div>';
      if(hasConflict) cell.className+=" has-conflict";
      cell.innerHTML=dateHtml+coursesHtml;
    }
    grid.appendChild(cell);
  }

  // Bind course click
  var cards=grid.querySelectorAll(".cc");
  for(var ci=0;ci<cards.length;ci++){
    cards[ci].onclick=function(){
      var cid=this.getAttribute("data-cid");
      var c=getCourseById(state.sem,cid);
      if(c) showModal(c);
    };
  }
}

function renderConflictPanel(){
  var sem=SEMESTERS[state.sem];
  var panel=document.getElementById("conflictPanel");
  var body=document.getElementById("conflictBody");
  if(!sem.conflicts.length){panel.style.display="none";return;}
  panel.style.display="block";
  var html="";
  for(var i=0;i<sem.conflicts.length;i++){
    var g=sem.conflicts[i];
    html+='<div class="conflict-group">';
    html+='<div class="cg-label">'+g.label+'</div>';
    html+='<div class="cg-options">';
    for(var j=0;j<g.courses.length;j++){
      var c=getCourseById(state.sem,g.courses[j]);
      var sel=state.selections[g.id];
      var cls="cg-opt";
      if(sel===c.id) cls+=" selected";
      else if(sel) cls+=" unselected";
      html+='<div class="'+cls+'" data-gid="'+g.id+'" data-cid="'+c.id+'">'+
        '<div class="dot '+c.type+'"></div>'+
        '<span>'+c.name+' ('+c.credits+'学分)</span>'+
        '</div>';
    }
    html+='</div>';
    if(sel) html+='<div class="cg-clear" data-gid="'+g.id+'">清除选择</div>';
    html+='</div>';
  }
  body.innerHTML=html;

  var opts=body.querySelectorAll(".cg-opt");
  for(var oi=0;oi<opts.length;oi++){
    opts[oi].onclick=function(){
      var gid=this.getAttribute("data-gid");
      var cid=this.getAttribute("data-cid");
      state.selections[gid]=cid;
      syncConflictToElective(gid,cid);
      renderAll();
      var c=getCourseById(state.sem,cid);
      showToast("已选择: "+c.name);
    };
  }
  var clears=body.querySelectorAll(".cg-clear");
  for(var cli=0;cli<clears.length;cli++){
    clears[cli].onclick=function(){
      var gid=this.getAttribute("data-gid");
      delete state.selections[gid];
      syncConflictToElective(gid,null);
      renderAll();
    };
  }
}

function renderStats(){
  var sem=SEMESTERS[state.sem];
  var total=sem.courses.length;
  var withDates=0;
  var selectedCount=Object.keys(state.selections).length;
  for(var i=0;i<sem.courses.length;i++){
    for(var j=0;j<sem.courses[i].sessions.length;j++){
      if(getSessionDates(sem.courses[i].sessions[j]).length>0){withDates++;break;}
    }
  }
  var html='<div class="stat"><div class="sn">'+total+'</div><div class="sl">总课程</div></div>';
  html+='<div class="stat"><div class="sn">'+withDates+'</div><div class="sl">已排日期</div></div>';
  html+='<div class="stat"><div class="sn">'+selectedCount+'</div><div class="sl">已选冲突</div></div>';
  html+='<div class="stat"><div class="sn">'+(sem.conflicts.length)+'</div><div class="sl">冲突组</div></div>';
  document.getElementById("stats").innerHTML=html;
}

function renderUnscheduled(){
  var sem=SEMESTERS[state.sem];
  var list=[];
  for(var i=0;i<sem.courses.length;i++){
    var c=sem.courses[i];
    var hasDates=false;
    for(var j=0;j<c.sessions.length;j++){
      if(getSessionDates(c.sessions[j]).length>0){hasDates=true;break;}
    }
    if(!hasDates) list.push(c);
  }
  var panel=document.getElementById("unschedPanel");
  var el=document.getElementById("unschedList");
  if(!list.length){panel.style.display="none";return;}
  panel.style.display="block";
  var html="";
  for(var k=0;k<list.length;k++){
    html+='<div><strong>'+list[k].name+'</strong> ('+list[k].code+") "+(list[k].note||"")+'</div>';
  }
  el.innerHTML=html;
}

function renderCatBar(label,val,target,color){
  var p=Math.min(100,Math.round(val/target*100));
  var over=val>target;
  return '<div class="sel-cat">'
    +'<div class="sel-cat-label"><span class="sel-cat-dot" style="background:'+color+'"></span>'+label+'</div>'
    +'<div class="sel-cat-bar"><div class="sel-cat-fill" style="width:'+p+'%;background:'+(over?'#dc2626':color)+'"></div></div>'
    +'<div class="sel-cat-num">'+val+'/'+target+(over?' <span style="color:#dc2626">+'+(val-target)+'</span>':'')+'</div>'
    +'</div>';
}

function renderSelectedPanel(){
  var sem=state.sem;
  var semData=SEMESTERS[sem];
  var otherSem=sem==="fall2026"?"spring2025":"fall2026";
  var TOT_C=26,TOT_M=2,TOT_E=17,TOT_ALL=45;

  var cC=0,cM=0,cE=0;
  semData.courses.forEach(function(c){
    var cr=parseCredits(c.credits);
    if(isCoreType(c.type)){cC+=cr;}
    else if(isMandatoryType(c.type)){cM+=cr;}
    else if(isElectiveType(c.type)&&state.electiveSel[sem][c.id]){cE+=cr;}
  });

  var oC=0,oM=0,oE=0;
  SEMESTERS[otherSem].courses.forEach(function(c){
    var cr=parseCredits(c.credits);
    if(isCoreType(c.type)){oC+=cr;}
    else if(isMandatoryType(c.type)){oM+=cr;}
    else if(isElectiveType(c.type)&&state.electiveSel[otherSem][c.id]){oE+=cr;}
  });

  var tC=cC+oC, tM=cM+oM, tE=cE+oE, tAll=tC+tM+tE;
  var pctF=function(a,b){return Math.min(100,Math.round(a/b*100));};

  var html='<div class="sel-overview">'
    +'<div class="sel-overview-total">'
    +'<div class="sp-top"><span>总学分（两学期）</span><span class="sp-num">'+tAll+' / '+TOT_ALL+' 分</span></div>'
    +'<div class="sp-bar"><div class="sp-fill" style="width:'+pctF(tAll,TOT_ALL)+'%;background:'+(tAll>TOT_ALL?'linear-gradient(90deg,#dc2626,#ea580c)':'linear-gradient(90deg,#2563eb,#0891b2)')+'"></div></div>'
    +'</div>'
    +'<div class="sel-breakdown">'
    +renderCatBar('核心课（含必修）',tC,TOT_C,'#2563eb')
    +renderCatBar('必选课',tM,TOT_M,'#b45309')
    +renderCatBar('选修课',tE,TOT_E,'#15803d')
    +'</div>'
    +'<div class="sel-summary">'
    +'<span class="ss-item" style="font-weight:600">两学期合计：核心'+tC+' + 必选'+tM+' + 选修'+tE+' = '+tAll+'</span>'
    +'<span class="ss-item">本'+semLabel(sem)+'：核心'+cC+' + 必选'+cM+' + 选修'+cE+' = '+(cC+cM+cE)+'</span>'
    +'<span class="ss-item">另'+semLabel(otherSem)+'：核心'+oC+' + 必选'+oM+' + 选修'+oE+' = '+(oC+oM+oE)+'</span>'
    +(tAll>TOT_ALL?'<span class="ss-item" style="color:#dc2626;background:#fef2f2;border-color:#fecaca">总学分超出'+(tAll-TOT_ALL)+'分</span>':'')
    +'</div>'
    +'</div>';

  var rowsHtml='';
  semData.courses.forEach(function(c){
    var isEle=isElectiveType(c.type);
    var selected=state.electiveSel[sem][c.id];
    var credits=parseCredits(c.credits);
    var cls="sel-item";
    if(!isEle) cls+=" si-fixed";
    if(c.conflict) cls+=selected?" si-conflict-selected":" si-conflict-pending";
    var checkboxAttr=isEle?'':'disabled checked';
    var checkedAttr=isEle?(selected?'checked':''):'checked';
    var typeColor=typeShortColors[c.type]||"#64748b";
    var typeBgMap2={core:"#eff6ff",req:"#f0fdfa",ele:"#f0fdf4",man:"#fffbeb",sum:"#fff7ed"};
    rowsHtml+='<div class="'+cls+'">'
      +'<input type="checkbox" data-sem="'+sem+'" data-cid="'+c.id+'" '+checkboxAttr+' '+checkedAttr+'>'
      +'<span class="si-type" style="color:'+typeColor+';background:'+(typeBgMap2[c.type]||'#f9fafb')+'">'+typeNamesFull[c.type]+'</span>'
      +'<span class="si-name" title="'+c.name+'">'+c.name+'</span>'
      +'<span class="si-credit">'+credits+'分</span>'
      +'</div>';
  });
  html+='<div class="sel-list">'+rowsHtml+'</div>';

  var el=document.getElementById("selectedBody");
  if(el) el.innerHTML=html;

  var cbs=el?el.querySelectorAll('input[type="checkbox"]'):[];
  for(var ci2=0;ci2<cbs.length;ci2++){
    (function(cb){
      cb.onchange=function(){
        if(cb.disabled) return;
        var sem2=cb.getAttribute("data-sem");
        var cid2=cb.getAttribute("data-cid");
        var course=getCourseById(sem2,cid2);
        state.electiveSel[sem2][cid2]=cb.checked;
        if(course&&course.conflict){
          if(cb.checked){
            state.selections[course.conflict]=cid2;
            syncConflictToElective(course.conflict,cid2);
          } else {
            if(state.selections[course.conflict]===cid2){
              delete state.selections[course.conflict];
            }
            syncConflictToElective(course.conflict,null);
          }
        }
        renderAll();
      };
    })(cbs[ci2]);
  }
}

function renderCourseList(){
  var sem=state.sem;
  var semData=SEMESTERS[sem];
  var rows=[], eleCredits=0, totalCredits=0;
  var typeBgMap2={core:"#eff6ff",req:"#f0fdfa",ele:"#f0fdf4",man:"#fffbeb",sum:"#fff7ed"};
  semData.courses.forEach(function(c){
    var isEle=isElectiveType(c.type);
    var selected = isEle ? state.electiveSel[sem][c.id] : true;
    if(!selected) return;
    var credits=parseCredits(c.credits);
    totalCredits+=credits;
    if(isEle) eleCredits+=credits;
    var typeColor=typeShortColors[c.type]||"#64748b";
    var timeParts=[];
    for(var i=0;i<c.sessions.length;i++){
      var s=c.sessions[i];
      if(s.weekly){
        var wds=["日","一","二","三","四","五","六"];
        var st=s.weekly.start.slice(5).replace("-","/");
        var en=s.weekly.end.slice(5).replace("-","/");
        var exc=s.weekly.except&&s.weekly.except.length?"(停"+s.weekly.except.length+"次)":"";
        timeParts.push("每周"+wds[s.weekly.dow]+" "+s.ts+"-"+s.te+" "+st+"-"+en+exc);
      }else if(s.dates&&s.dates.length){
        var f=s.dates[0].slice(5).replace("-","/");
        var l=s.dates[s.dates.length-1].slice(5).replace("-","/");
        timeParts.push(f+"~"+l+" "+s.ts+"-"+s.te);
      }
    }
    var timeStr=timeParts.length?timeParts.join("；"):(c.note||"待定");
    rows.push({code:c.code,name:c.name,type:c.type,typeName:typeNamesFull[c.type],credits:credits,teacher:c.teacher,room:c.room,time:timeStr,typeColor:typeColor,typeBg:typeBgMap2[c.type]||"#f9fafb"});
  });
  // Sort by type order: core > req > man > ele > sum
  var typeOrder={core:0,req:1,man:2,ele:3,sum:4};
  rows.sort(function(a,b){return typeOrder[a.type]!==typeOrder[b.type]?typeOrder[a.type]-typeOrder[b.type]:a.code.localeCompare(b.code);});
  var html="";
  if(rows.length===0){
    html='<div class="cl-empty">暂未选择任何课程</div>';
  }else{
    html+='<div style="overflow-x:auto"><table class="cl-table"><thead><tr><th>编码</th><th>课程名称</th><th>类型</th><th>学分</th><th>教师</th><th>教室</th><th>上课时间</th></tr></thead><tbody>';
    var lastType="";
    for(var k=0;k<rows.length;k++){
      var r=rows[k];
      if(r.type!==lastType&&lastType!==""){
        html+='<tr class="cl-summary"><td colspan="7"></td></tr>';
      }
      lastType=r.type;
      html+='<tr><td class="cl-code">'+r.code+'</td><td class="cl-name">'+r.name+'</td><td><span class="type-tag '+r.type+'" style="background:'+r.typeBg+'">'+r.typeName+'</span></td><td>'+r.credits+'分</td><td>'+r.teacher+'</td><td>'+r.room+'</td><td class="cl-time">'+r.time+'</td></tr>';
    }
    html+='<tr class="cl-summary"><td colspan="3" style="text-align:right">选修学分</td><td>'+eleCredits+' / '+state.TARGET_CREDITS+'</td><td colspan="3" style="text-align:right;color:var(--text2)">已选总学分：'+totalCredits+' 分</td></tr>';
    html+='</tbody></table></div>';
  }
  var el=document.getElementById("courseListBody");
  if(el) el.innerHTML=html;
}

function renderAll(){

  renderConflictPanel();
  renderSelectedPanel();

function updateNavButtons(){

// ========== MODAL ==========
function showModal(c){
  var overlay=document.getElementById("modalOverlay");
  var modal=document.getElementById("modalContent");
  var typeNames={core:"核心课",req:"必修课",ele:"选修课",man:"必选课",sum:"暑期课"};
  var html='<div class="modal-head"><h3>'+c.name+'</h3>';
  html+='<button class="modal-close" id="modalClose">&times;</button></div>';
  html+='<div class="modal-body">';
  html+='<div class="modal-row"><div class="mr-label">编码</div><div class="mr-val">'+c.code+'</div></div>';
  html+='<div class="modal-row"><div class="mr-label">类型</div><div class="mr-val">'+typeNames[c.type]+'</div></div>';
  html+='<div class="modal-row"><div class="mr-label">学分</div><div class="mr-val">'+c.credits+'</div></div>';
  html+='<div class="modal-row"><div class="mr-label">教师</div><div class="mr-val">'+c.teacher+'</div></div>';
  html+='<div class="modal-row"><div class="mr-label">教室</div><div class="mr-val">'+c.room+'</div></div>';
  var allDates=[];
  for(var i=0;i<c.sessions.length;i++){
    var ds=getSessionDates(c.sessions[i]);
    for(var j=0;j<ds.length;j++){
      allDates.push(ds[j]+" "+c.sessions[i].ts+"-"+c.sessions[i].te);
    }
  }
  if(allDates.length){
    html+='<div class="modal-row"><div class="mr-label">上课时间</div><div class="mr-val modal-dates">';
    for(var k=0;k<allDates.length;k++){
      var p=parseISO(allDates[k].split(" ")[0]);
      html+=p.m+1+"/"+p.d+"("+["日","一","二","三","四","五","六"][new Date(allDates[k].split(" ")[0]+"T00:00:00").getDay()]+") "+allDates[k].split(" ")[1]+"<br>";
    }
    html+='</div></div>';
  }
  if(c.note) html+='<div class="modal-row"><div class="mr-label">备注</div><div class="mr-val">'+c.note+'</div></div>';
  if(c.conflict){
    var cg=null;
    var sem=SEMESTERS[state.sem];
    for(var ci=0;ci<sem.conflicts.length;ci++){if(sem.conflicts[ci].id===c.conflict){cg=sem.conflicts[ci];break;}}
    if(cg){
      html+='<div class="modal-row"><div class="mr-label">冲突组</div><div class="mr-val">此课程与以下课程时间冲突，只能选一门：<br>';
      for(var ck=0;ck<cg.courses.length;ck++){
        var oc=getCourseById(state.sem,cg.courses[ck]);
        if(oc.id!==c.id) html+="  - "+oc.name+"<br>";
      }
      html+='</div></div>';
    }
  }
  html+='</div>';
  modal.innerHTML=html;
  overlay.className="modal-overlay show";
  document.getElementById("modalClose").onclick=function(){overlay.className="modal-overlay";};
  overlay.onclick=function(e){if(e.target===overlay)overlay.className="modal-overlay";};
}

// ========== EXPORT PDF ==========
function exportPDF() {
  var sem = SEMESTERS[state.sem];
  var container = document.getElementById("printContainer");
  var typeColors = {core:"#2563eb",req:"#0f766e",ele:"#15803d",man:"#b45309",sum:"#d97706"};
  var typeBgs = {core:"#eff6ff",req:"#f0fdfa",ele:"#f0fdf4",man:"#fffbeb",sum:"#fff7ed"};
  var monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  var savedFilter = state.filter;
  state.filter = "all";

  var html = '<div class="print-header">';
  html += '<h1>' + sem.name + ' 课程表</h1>';
  html += '<p>导出日期: ' + new Date().toLocaleDateString("zh-CN") + '</p>';
  var sels = [];
  for (var gid in state.selections) {
    var sc = getCourseById(state.sem, state.selections[gid]);
    if (sc) sels.push(sc.name);
  }
  if (sels.length) html += '<p>已选冲突课: ' + sels.join("\u3001") + '</p>';
  html += '<div class="print-legend"><span style="color:#2563eb">核心课</span><span style="color:#0f766e">必修课</span><span style="color:#15803d">选修课</span><span style="color:#b45309">必选课</span><span style="color:#d97706">暑期课</span><span style="color:#ef4444">假日停课</span></div>';
  html += '</div>';

  var y = sem.rangeStart.y, m = sem.rangeStart.m;
  while (y < sem.rangeEnd.y || (y === sem.rangeEnd.y && m <= sem.rangeEnd.m)) {
    html += genPrintMonth(y, m, sem, typeColors, typeBgs, monthNames);
    m++;
    if (m > 11) { m = 0; y++; }
  }

  container.innerHTML = html;
  window.print();
  state.filter = savedFilter;
}

function genPrintMonth(y, m, sem, typeColors, typeBgs, monthNames) {
  var wds = ["周一","周二","周三","周四","周五","周六","周日"];
  var html = '<div class="print-month">';
  html += '<div class="print-month-title">' + y + '年' + monthNames[m] + '</div>';
  html += '<div class="print-cal-weekdays">';
  for (var i = 0; i < 7; i++) {
    var wdCls = (i >= 5) ? "print-cal-wd weekend" : "print-cal-wd";
    html += '<div class="' + wdCls + '">' + wds[i] + '</div>';
  }
  html += '</div>';
  html += '<div class="print-cal-grid">';
  var firstDay = new Date(y, m, 1);
  var firstDOW = firstDay.getDay();
  var mondayOffset = firstDOW === 0 ? 6 : firstDOW - 1;
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var totalCells = Math.ceil((mondayOffset + daysInMonth) / 7) * 7;
  for (var i = 0; i < totalCells; i++) {
    var dayNum = i - mondayOffset + 1;
    if (dayNum < 1 || dayNum > daysInMonth) {
      html += '<div class="cal-cell other"></div>';
    } else {
      var ds = fmtDate(y, m, dayNum);
      var holName = sem.holidays[ds];
      var courses = getCoursesForDate(ds);
      var cellCls = "cal-cell";
      if (holName) cellCls += " holiday";
      html += '<div class="' + cellCls + '">';
      html += '<div class="cal-date">' + dayNum;
      if (holName) html += ' <span class="hol-name">' + holName + '</span>';
      html += '</div>';
      html += '<div class="cal-courses">';
      if (holName && !courses.length) {
        html += '<div class="cal-empty">' + holName + '停课</div>';
      } else if (courses.length) {
        for (var k = 0; k < courses.length; k++) {
          var c = courses[k].course;
          var s = courses[k].session;
          var cls = "cc cc-" + c.type;
          if (c.conflict && !state.selections[c.conflict]) cls += " cc-conflict";
          var badge = getConflictBadge(c);
          html += '<div class="' + cls + '">';
          html += '<div class="cc-name">' + c.name + badge + '</div>';
          html += '<div class="cc-time">' + s.ts + '-' + s.te + ' ' + c.room + '</div>';
          html += '</div>';
        }
      }
      html += '</div></div>';
    }
  }
  html += '</div></div>';
  return html;
}



// ========== SAVE STATE ==========
function saveState() {
  var stateData = {
    sem: state.sem,
    year: state.year,
    month: state.month,
    selections: state.selections,
    electiveSel: state.electiveSel,
    filter: state.filter
  };
  var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var stateJson = JSON.stringify(stateData);
  var stateScript = '\n<script>window.__SAVED_STATE=' + stateJson + ';<' + '/script>\n';
  html = html.replace('</body>', stateScript + '</body>');
  var blob = new Blob([html], {type: 'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var d = new Date();
  a.download = 'MBA课程表_' + d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2) + '.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('选课状态已保存');
}

document.getElementById("exportBtn").onclick = exportPDF;
document.getElementById("saveBtn").onclick = saveState;


function isCoreType(t){return t==="core"||t==="req";}
function isMandatoryType(t){return t==="man";}
function isElectiveType(t){return t==="ele"||t==="sum";}
function parseCredits(str){var n=parseInt(str);return isNaN(n)?0:n;}
function semLabel(s){return s==="fall2026"?"秋季":"春季";}
var typeNamesFull={core:"核心",req:"必修",ele:"选修",man:"必选",sum:"暑期"};
var typeShortColors={core:"#2563eb",req:"#0f766e",ele:"#15803d",man:"#b45309",sum:"#d97706"};

function syncConflictToElective(gid,cid){
  var cg=null;
  var sem=SEMESTERS[state.sem];
  for(var k=0;k<sem.conflicts.length;k++){if(sem.conflicts[k].id===gid){cg=sem.conflicts[k];break;}}
  if(!cg)return;
  for(var k=0;k<cg.courses.length;k++){
    var cid2=cg.courses[k];
    state.electiveSel[state.sem][cid2]=(cid!==null&&cid2===cid);
  }
}

function initElectiveDefaults(){
  ["fall2026","spring2025"].forEach(function(semKey){
    state.electiveSel[semKey]={};
    SEMESTERS[semKey].courses.forEach(function(c){
      state.electiveSel[semKey][c.id]=false;
    });
  });
}


// Init
if (window.__SAVED_STATE) {
  var s = window.__SAVED_STATE;
  state.sem = s.sem;
  state.year = s.year;
  state.month = s.month;
  state.selections = s.selections || {};
  state.electiveSel = s.electiveSel || {fall2026:{},spring2025:{}};
  state.filter = s.filter || "all";
  if (s.sem === "spring2025") {
    var tabs = document.querySelectorAll(".tab");
    if (tabs.length >= 2) { tabs[0].classList.remove("active"); tabs[1].classList.add("active"); }
  }
} else {
  initElectiveDefaults();
}
renderAll();
</script>
