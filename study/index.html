<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>三表分拣台 · 会计期末冲刺</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231A5FD0'/%3E%3Crect x='7' y='8' width='18' height='3.4' rx='1.7' fill='%23fff'/%3E%3Crect x='7' y='14.3' width='13' height='3.4' rx='1.7' fill='%23fff' opacity='.82'/%3E%3Crect x='7' y='20.6' width='9' height='3.4' rx='1.7' fill='%23FFB020'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface2:#F3F4F7; --surface3:#EBEDF2;
  --text:#1F2329; --text2:#5A616D; --text3:#666D78;
  --primary:#1A5FD0; --primary-h:#164FB0; --primary-c:#E8F0FE;
  --error:#C42C74; --error-c:#FDF0F6;
  --warning:#B45309; --warning-c:#FFF8EC;
  --success:#0B7C7C; --success-c:#EDF9F9;
  --border:#EDEFF3; --border2:#DDE1E8;
  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px; --r-full:999px;
  --sh1:0 4px 14px rgba(13,32,84,.04);
  --sh2:0 8px 22px rgba(13,32,84,.06);
  --sh3:0 18px 44px rgba(13,32,84,.14);
  --sys:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --num:"Inter",ui-monospace,"SF Mono",Menlo,sans-serif;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sys);font-size:14px;line-height:22px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.wrap{width:100%;padding:0 0 72px}
.wrap>.top{width:100%}
.wrap>*:not(.top){max-width:1200px;margin-left:auto;margin-right:auto;padding-left:32px;padding-right:32px}
.numbar{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 180px);align-items:center}
.numbar .hud{width:100%;max-width:760px;margin:0 auto 16px}
.wrap>.numcard{max-width:760px;padding:32px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:20px;height:64px;position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);margin-bottom:24px;
  padding:0 max(32px,calc((100vw - 1200px)/2 + 32px))}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;border-radius:2px;background:#FFB020;display:inline-block}
.brand .logo{width:28px;height:28px;display:block;flex:none}
.brand em{font-style:normal;color:var(--text2);font-weight:500;font-size:12px;letter-spacing:0}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{border:0;background:none;color:var(--text2);font-size:13px;font-weight:500;padding:7px 14px;border-radius:var(--r-full);transition:.12s}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.on{background:var(--primary-c);color:var(--primary);font-weight:600}

/* ---------- hud ---------- */
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hud .k{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:7px 12px;font-size:12px;color:var(--text2);font-weight:500}
.hud b{color:var(--text);font-family:var(--num);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.hud .k.grow{margin-left:auto}
.hp{width:88px;height:6px;background:var(--surface3);border-radius:var(--r-full);overflow:hidden}
.hp i{display:block;height:100%;background:var(--success);border-radius:var(--r-full);transition:width .3s}
.hp.low i{background:var(--error)}
.combo.hot{color:var(--primary)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.8fr);gap:24px;background:linear-gradient(180deg,#FFFFFF 0%,#F8FAFF 100%);border:1px solid #DCE7F7;border-radius:24px;padding:30px;box-shadow:var(--sh1);margin-bottom:14px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-90px;top:-110px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--primary-c) 0%,rgba(232,240,254,0) 70%);pointer-events:none}
.hero-copy{position:relative;z-index:1}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--primary);background:var(--primary-c);border:1px solid #D6E4F8;border-radius:var(--r-full);padding:5px 11px;margin-bottom:16px}
.eyebrow-dot{width:6px;height:6px;border-radius:50%;background:#FFB020}
.hero h1{font-family:var(--serif);font-size:clamp(30px,4vw,44px);line-height:1.16;font-weight:700;letter-spacing:-.01em;margin:0 0 12px;color:var(--text)}
.hero p{margin:0;color:var(--text2);font-size:14px;line-height:22px;max-width:520px}
.stats{display:flex;flex-wrap:wrap;margin-top:22px;border-top:1px solid #E6ECF5;padding-top:16px}
.stats>div{min-width:90px;padding:0 18px;border-left:1px solid #E6ECF5}
.stats>div:first-child{padding-left:0;border-left:0}
.stats b{display:block;font-family:var(--num);font-size:24px;line-height:30px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stats span{display:block;font-size:11px;color:var(--text3);font-weight:500;margin-top:2px}
.stats .stat-rank b{font-size:18px;line-height:26px;letter-spacing:0}
.reset-link{margin-top:12px;background:none;border:0;padding:0;color:var(--text3);font-size:11px;text-decoration:underline}
.handbook-card{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-between;background:#FFB020;color:var(--text);border:1px solid #EDA300;border-radius:20px;padding:22px;min-height:252px;text-decoration:none;box-shadow:0 16px 34px rgba(255,176,32,.28);transition:.16s;overflow:hidden}
.handbook-card:before{content:"";position:absolute;right:-36px;bottom:-48px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.22)}
.handbook-card:hover{transform:translateY(-3px);box-shadow:0 22px 46px rgba(255,176,32,.36)}
.handbook-card:focus-visible{outline:3px solid rgba(26,95,208,.35);outline-offset:3px}
.trow:focus-visible{outline:2px solid var(--primary);outline-offset:-2px;background:#F8FAFF}
.hc-top,.hc-main,.hc-foot{position:relative;z-index:1}
.hc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hc-pill{background:var(--text);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 9px;border-radius:var(--r-full)}
.hc-live{font-size:11px;font-weight:600;color:var(--text);background:rgba(255,255,255,.55);padding:4px 9px;border-radius:var(--r-full)}
.hc-main{margin:18px 0 16px}
.hc-kicker{font-size:11px;font-weight:600;letter-spacing:.04em;color:rgba(31,35,41,.72);margin-bottom:6px}
.hc-title{font-family:var(--serif);font-size:clamp(30px,3vw,40px);line-height:1.05;font-weight:700;letter-spacing:.02em}
.hc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:600;color:rgba(31,35,41,.78);border-top:1px solid rgba(31,35,41,.18);padding-top:12px}
.hc-arrow{background:var(--text);color:#fff;padding:6px 12px;border-radius:var(--r-full);font-size:12px;font-weight:600}
.navhand{display:inline-flex;align-items:center;padding:7px 14px;border-radius:var(--r-full);background:var(--primary);color:#fff;font-size:13px;font-weight:600;text-decoration:none}
.navhand:hover{background:var(--primary-h)}
.train{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px 22px 8px;box-shadow:var(--sh1);margin-top:14px}
.train-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 2px 14px;border-bottom:1px solid var(--border)}
.kicker{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--primary);margin-bottom:3px}
.train-head h2{font-family:var(--serif);font-size:21px;font-weight:700;margin:0;letter-spacing:.01em}
.train-note{font-size:11.5px;color:var(--text3);padding-bottom:2px}
.train-list{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:38px minmax(0,1fr) 170px 72px;align-items:center;gap:14px;width:100%;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--border);text-align:left;color:var(--text);transition:background .12s}
.trow:last-child{border-bottom:0}
.trow:hover{background:#F8FAFF}
.tnum{width:34px;height:34px;border-radius:10px;border:1px solid;display:grid;place-items:center;font-family:var(--num);font-size:11.5px;font-weight:700}
.tmain b{display:block;font-size:14.5px;font-weight:600;margin-bottom:2px}
.tmain span{display:block;font-size:12px;color:var(--text2);line-height:17px}
.tprog{display:flex;align-items:center;gap:8px}
.tbar{flex:1;height:5px;border-radius:var(--r-full);background:var(--surface3);overflow:hidden}
.tbar i{display:block;height:100%;border-radius:var(--r-full)}
.tprog em{font-style:normal;font-family:var(--num);font-size:11px;color:var(--text3);min-width:38px;text-align:right}
.tgo{font-size:12px;font-weight:600;text-align:right;white-space:nowrap}

/* ---------- traps ---------- */
.traps{background:linear-gradient(180deg,var(--warning-c) 0%,#FFFFFF 100%);border:1px solid #F1DFC4;border-radius:20px;padding:18px 22px;box-shadow:none;margin-top:14px}
.traps .th{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--warning);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.traps .th:before{content:"";width:3px;height:14px;border-radius:2px;background:var(--warning)}
.traps ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.traps li{padding:0 16px;border-left:1px solid var(--border)}
.traps li:first-child{border-left:0;padding-left:0}
.traps b{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.traps span{font-size:12px;line-height:18px;color:var(--text2);display:block}


/* ---------- exam rail / picker ---------- */
.railwrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.rail{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;min-width:220px}
.rail .rq{width:30px;height:30px;padding:0;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--text2);font-family:var(--num);font-size:12px;font-weight:600}
.rail .rq:hover{border-color:var(--primary);color:var(--primary)}
.rail .rq.ok{border-color:var(--success);background:var(--success-c);color:#0B7C7C}
.rail .rq.no{border-color:var(--error);background:var(--error-c);color:var(--error)}
.rail .rq.cur{border-color:var(--primary);background:var(--primary);color:#fff}
.rail .rq.cur.ok,.rail .rq.cur.no{color:#fff}
.rail .rq.cur.ok{background:var(--success);border-color:var(--success)}
.rail .rq.cur.no{background:var(--error);border-color:var(--error)}
.rail span{font-size:11px;color:var(--text3);white-space:nowrap}
.jumpbox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);white-space:nowrap}
.jumpbox input{width:58px;height:30px;border:1px solid var(--border2);border-radius:8px;text-align:center;font-family:var(--num);font-size:12px;background:var(--surface);color:var(--text)}
.jumpbox button{height:30px;padding:0 12px;border:1px solid var(--border2);background:var(--surface);border-radius:8px;font-size:12px;color:var(--text2)}
.jumpbox button:hover{border-color:var(--primary);color:var(--primary)}

.jepanel{background:var(--warning-c);border:1px solid #F0DFC4;border-left:3px solid var(--warning);border-radius:var(--r-md);padding:12px 14px}
.jepanel .lab{font-size:11px;font-weight:600;color:var(--warning);margin-bottom:6px}
.entryline{font-family:var(--num);font-size:12px;line-height:20px;background:var(--surface2);border-radius:var(--r-sm);padding:9px 12px;color:var(--text)}

.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.excard{cursor:pointer;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;
  box-shadow:var(--sh1);transition:.16s;display:flex;flex-direction:column;color:var(--text)}
.excard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.excard .n{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--primary);margin-bottom:8px}
.excard h3{margin:0 0 6px;font-size:17px;letter-spacing:-.01em}
.excard p{margin:0;font-size:12.5px;color:var(--text2);line-height:19px}
.excard .meta{display:flex;gap:14px;margin:14px 0 12px;font-size:11.5px;color:var(--text3);font-family:var(--num)}
.excard .go{font-size:13px;font-weight:600;color:var(--primary);margin-top:auto}
.wrongbar{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 16px;background:var(--error-c);border:1px solid #F6D9E7;border-radius:var(--r-md)}
.wrongbar b{font-size:13px}
.wrongbar span{margin-left:8px;font-size:12px;color:var(--text2)}
.wrongbar .btn{margin-left:auto}
.tipnote{margin-top:16px;font-size:12px;color:var(--text3);line-height:19px}
.pagefill{padding-top:8px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);
  border-radius:var(--r-lg);overflow:hidden;margin-top:22px;background:var(--surface)}
.steps>div{padding:16px 18px;border-left:1px solid var(--border)}
.steps>div:first-child{border-left:0}
.hist{margin-top:22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 20px;box-shadow:var(--sh1)}
.hist .hh{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:10px}
.hist table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.hist td{padding:7px 4px;border-bottom:1px solid var(--border);color:var(--text2)}
.hist td:first-child{color:var(--text);font-weight:600;width:90px}
.hist td:last-child{text-align:right;color:var(--text3);font-size:11.5px}
.hist tr:last-child td{border-bottom:0}
.hist .ok{color:var(--success);font-weight:700}
.hist .mid{color:var(--warning);font-weight:700}
.hist .no{color:var(--error);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.tags i{font-style:normal;font-size:11px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-full);padding:2px 9px}
.steps b{display:block;font-size:13px;margin-bottom:5px}
.steps span{font-size:12px;color:var(--text2);line-height:18px;display:block}

/* ---------- play ---------- */
.board{display:grid;gap:14px}
.ticket{position:relative;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--sh1)}
.ticket .meta{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text3);margin-bottom:10px}
.ticket .meta .tag{background:var(--primary-c);color:var(--primary);padding:2px 8px;border-radius:var(--r-xs)}
.ticket p{margin:0;font-size:16px;line-height:26px;color:var(--text);max-width:920px}
.stamp{position:absolute;right:20px;top:20px;border:2px solid var(--success);color:var(--success);border-radius:var(--r-full);
  padding:5px 14px;font-size:11px;font-weight:700;letter-spacing:.18em;opacity:0;transform:scale(.6)}
.stamp.on{animation:stampin .34s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stampin{0%{opacity:0;transform:scale(1.5)}60%{opacity:1;transform:scale(.96)}100%{opacity:1;transform:scale(1)}}

.tray-label{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:var(--text2);margin:4px 0 2px}
.tray-label:after{content:"";flex:1;height:1px;background:var(--border)}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;border:1px dashed var(--border2);border-radius:var(--r-md);background:#FBFCFD}
*:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.chip{min-height:40px;border:1px solid var(--border2);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:var(--r-md);
  font-size:13px;font-weight:500;line-height:20px;transition:.12s;text-align:left}
.chip:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.chip.sel{border-color:var(--primary);background:var(--primary);color:#fff;font-weight:600;box-shadow:0 0 0 3px rgba(26,95,208,.18);transform:translateY(-1px)}
.chip.sel:hover{color:#fff}
.chip .selmark{display:inline-block;margin-left:7px;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.22);font-size:10px;font-weight:700}
.chip.done{opacity:.4;pointer-events:none;text-decoration:line-through}
.chip.bad{border-color:var(--error);background:var(--error-c);color:var(--error)}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:40px;margin:8px 0 2px;padding:9px 12px;border:1px dashed var(--border2);border-radius:10px;background:#FBFCFD;font-size:12px;color:var(--text2)}
.selbar.on{border-style:solid;border-color:var(--primary);background:var(--primary-c)}
.selbar .sb-k{font-family:var(--num);font-size:10px;letter-spacing:.08em;color:var(--primary);background:#fff;border:1px solid #D6E4F8;border-radius:99px;padding:2px 7px;flex:none}
.selbar b{color:var(--text);font-size:13px;font-weight:700}
.selbar .sb-hint{flex:1;min-width:160px;line-height:1.5}
.selbar .sb-x{border:0;background:none;color:var(--text3);font-size:12px;text-decoration:underline;padding:0;flex:none}
.selbar .sb-x:hover{color:var(--text)}
.bins.targeting .bin{border-color:var(--primary);box-shadow:0 0 0 2px rgba(26,95,208,.1);cursor:pointer}
.bins.targeting .bin .drop{cursor:pointer}
.bins.targeting .bin h3 span{color:var(--primary);font-weight:600}
.bin.flash{animation:binflash .45s ease}
@keyframes binflash{0%{box-shadow:0 0 0 0 rgba(26,95,208,.4)}100%{box-shadow:0 0 0 10px rgba(26,95,208,0)}}
.chip .ok{color:var(--success);margin-left:6px;font-weight:700}
.chip .no{color:var(--error);margin-left:6px;font-weight:700}

.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bin{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh1);display:flex;flex-direction:column;min-height:clamp(180px,20vh,230px);overflow:hidden}
.bin h3{margin:0;font-size:13px;font-weight:600;padding:13px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
.bin h3 span{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:0}
.bin[data-s="bs"] h3{color:var(--primary);background:#F7FAFF}
.bin[data-s="is"] h3{color:#0B7C7C;background:#F5FBFB}
.bin[data-s="cf"] h3{color:var(--warning);background:#FFFBF5}
.drop{flex:1;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:clamp(130px,15vh,180px);position:relative;transition:.12s;border-radius:0 0 var(--r-lg) var(--r-lg)}
.drop.armed{background:var(--primary-c);outline:1px dashed var(--primary);outline-offset:-4px}
.drop .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--text3);pointer-events:none}
.drop *:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.chip.lock{pointer-events:none;cursor:default}
.drop .chip.good{border-color:var(--success);background:var(--success-c);color:#0B7C7C}
.drop .chip.bad{border-color:var(--error);background:var(--error-c)}
.tip{font-size:12px;color:var(--text3)}
.fillrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;padding:7px 8px;margin-bottom:6px;border:1px solid var(--border2);border-radius:8px;background:var(--surface)}
.fillrow .fr-k{flex:1 1 120px;min-width:0;font-size:12.5px;font-weight:500;line-height:1.35;color:var(--text)}
.fillrow .fr-sign{width:30px;height:28px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-family:var(--num);font-size:14px;font-weight:700;padding:0;flex:none}
.fillrow .fr-sign.neg{color:var(--error);border-color:var(--error);background:var(--error-c)}

.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:2px}
.btn{border:0;border-radius:var(--r-full);height:40px;padding:0 22px;font-size:13.5px;font-weight:600;transition:.12s}

.wrongstrip{margin:2px 0;border:1px solid #F3CBDD;background:var(--error-c);border-radius:var(--r-md);padding:12px 14px}

/* ---------- progress / resume ---------- */
.hintbar{margin:10px 2px 0;font-size:12px;color:var(--text3);line-height:18px}

/* ---------- numbers ---------- */

.numcard .q{font-size:22px;line-height:32px;font-weight:600;letter-spacing:-.01em;margin-bottom:22px}
.answer{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.answer input{width:180px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-md);color:var(--text);
  font-family:var(--num);font-size:26px;font-weight:600;padding:10px 16px;text-align:right;font-variant-numeric:tabular-nums}
.answer input:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px rgba(26,95,208,.12)}
.answer .u{color:var(--text3);font-size:13px}
.streakbar{display:flex;gap:6px;margin-top:20px}
.streakbar i{width:18px;height:5px;border-radius:var(--r-full);background:var(--surface3)}

/* ---------- statements ---------- */
.sheets{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}

  .sheets{grid-template-columns:repeat(3,1fr)}

}

.foot{font-size:11.5px;color:var(--text3);margin-top:12px;line-height:18px}
.check{color:var(--success);font-weight:700}
.auditrow{cursor:pointer}
.auditrow td{transition:background .12s}

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script>
/* =========================================================
   数据：业务卡（三表投放）
   imp = 正确影响 [表, 科目, 金额]
   dec = 干扰项   [表, 科目]
   ========================================================= */

function normStats(raw){

function readCookie(){
  const m=document.cookie.match(new RegExp("(?:^|; )"+CK+"=([^;]*)"));
  if(!m)return null;
  try{return JSON.parse(decodeURIComponent(m[1]))}catch(e){return null}
}
function writeCookie(obj){
  try{
    const data=JSON.parse(JSON.stringify(obj));
    const enc=()=>encodeURIComponent(JSON.stringify(data));
    let v=enc();
    if(v.length>3800){
      ["S","N","Q"].forEach(k=>{if(data.stats&&data.stats[k])data.stats[k].hist=(data.stats[k].hist||[]).slice(0,3)});
      v=enc();
    }
    if(v.length>3800){
      ["S","N","Q"].forEach(k=>{if(data.stats&&data.stats[k])data.stats[k].hist=[]});
      v=enc();
    }
    if(v.length>3800&&data.session){
      data.session=Object.assign({},data.session,{placed:[],pool:null});
      v=enc();
    }
    if(v.length>3800&&data.session){
      data.session=null;
      v=enc();
    }
    document.cookie=CK+"="+v+";path=/;max-age=15552000;SameSite=Lax";
  }catch(e){}
}

let _authCfg=null;

async function refreshIdToken(){
  let rt="";try{rt=localStorage.getItem("mba-refresh-token")||""}catch(e){}
  if(!rt)return false;
  try{
    const cfg=await authConfig();
    const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:rt,client_id:cfg.clientId});
    const r=await fetch(cfg.issuer.replace(/\/$/,'')+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    if(r.status===400||r.status===401){try{localStorage.removeItem('mba-refresh-token')}catch(e){}return false}
    if(!r.ok)return false;
    const t=await r.json();
    if(!t.id_token)return false;
    try{localStorage.setItem('mba-id-token',t.id_token);if(t.refresh_token)localStorage.setItem('mba-refresh-token',t.refresh_token)}catch(e){}
    return true;
  }catch(e){return false}
}
// 401 时先续期再重试一次，续不上才退回未登录
async function authFetch(url,opts){
  opts=opts||{};
  const send=function(){
    const h=Object.assign({},opts.headers||{});
    const t=token();
    if(t)h.Authorization='Bearer '+t;
    return fetch(url,Object.assign({},opts,{headers:h}));
  };
  let r=await send();
  if(r.status===401){
    const ok=await refreshIdToken();
    if(ok)r=await send();
  }
  return r;
}

function mergeCloud(c){
  const cloudAt=num(c.at,0), newer=cloudAt>num(S.localAt,0);
  S.xp=Math.max(num(S.xp,0),num(c.xp,0));
  S.best=Math.max(num(S.best,0),num(c.best,0));
  const un=(a,b)=>{const out=new Set(a);b.forEach(x=>out.add(x));return out};
  S.mastered=un(S.mastered,strArr(c.mastered).filter(byId));
  S.xpEarned=un(S.xpEarned,strArr(c.xpEarned).filter(byId));
  S.numSeen=un(S.numSeen,idxArr(c.num&&c.num.seen).filter(i=>i>=0));
  S.quizSeen=un(S.quizSeen,idxArr(c.quiz&&c.quiz.seen).filter(i=>i>=0));
  S.auditSeen=un(S.auditSeen,strArr(c.auditSeen).filter(x=>["S","N","Q"].includes(x)));
  if(newer)S.practiceWrong=new Set(strArr(c.practiceWrong).filter(byId));
  const cs=normStats(c.stats);
  ["S","N","Q"].forEach(k=>{
    const a=S.stats[k], b=cs[k];
    a.runs=Math.max(a.runs,b.runs);a.best=Math.max(a.best,b.best);
    if(b.ms&&(!a.ms||b.ms<a.ms))a.ms=b.ms;
    if(newer)a.wrong=b.wrong.slice();
    const hist={};[...a.hist,...b.hist].forEach(h=>{if(h&&!hist[h.t])hist[h.t]=h});
    a.hist=Object.values(hist).sort((x,y)=>y.t-x.t).slice(0,6);
  });
  if(newer){
    const nb=c.num||{}, qb=c.quiz||{};
    S.numIdx=Math.max(0,Math.round(num(nb.idx,0)));
    S.numStreak=Math.max(0,Math.round(num(nb.streak,0)));
    S.quizI=Math.max(0,Math.round(num(qb.idx,0)));
    S.quizStreak=Math.max(0,Math.round(num(qb.streak,0)));
  }
  S.localAt=Math.max(num(S.localAt,0),cloudAt);
}

function resumeSession(){

  while(S.flags.length<S.deck.length)S.flags.push(null);
  S.hits=Array.isArray(x.hits)?x.hits.slice(0,S.deck.length).map(v=>Math.max(0,Math.round(num(v,0)))):S.deck.map(()=>0);
  while(S.hits.length<S.deck.length)S.hits.push(0);
  S.correct=S.flags.filter(v=>v===true).length;
  S.hit=S.hits.reduce((a,b)=>a+b,0);
  S.totalImp=S.deck.reduce((a,c)=>a+c.imp.length,0);
  S.combo=0; S.elapsedBase=Math.max(0,num(x.elapsedBase,0)); S.t0=0; S.elapsed=0;

function buildCard(){

  S.placed=[]; S.sel=null; S.graded=false; S.stamped=false; S.jeOpen=false; S.hinted=false;
}

function jumpTo(i){
  if(!S.deck.length)return;
  i=Math.max(0,Math.min(S.deck.length-1,Math.round(num(i,0))));

  saveCardState();
  const answered=S.flags[i]!==null;
  if(answered&&!S.cardStates[i]){
    if(!confirm("这道题之前答过，但刷新后作答明细没保存。重做会重新计分，继续？"))return;
    S.flags[i]=null; S.hits[i]=0;
    S.correct=S.flags.filter(v=>v===true).length;
    S.hit=S.hits.reduce((a,b)=>a+b,0);
  }
  S.i=i; S.sel=null; S._justGraded=false;
  const st=S.cardStates[i];
  if(st){
    const c=S.deck[i];
    c._pool=st.pool;
    S.placed=st.placed.map(p=>({c:p.c,bin:p.bin,sign:p.sign===-1?-1:1,amt:p.amt==null?"":String(p.amt)}));

function place(i,bin){
  if(S.graded)return;
  S.placed=S.placed.filter(p=>p.c!==i);
  S.placed.push({c:i,bin,sign:1,amt:""}); S.sel=null; render();
  const b=document.querySelector('[data-bin="'+bin+'"]');
  if(b&&b.focus)b.focus({preventScroll:true});
  if(b){b.classList.add("flash");setTimeout(()=>b.classList.remove("flash"),450)}
  toast(`已放入${STN[bin]}${S.tableMode?" · 选 +/− 填金额":""}`);
  if(window.matchMedia&&window.matchMedia("(max-width:600px)").matches){
    const amt=document.querySelector('.fillrow [data-amt="'+i+'"]');
    if(amt){
      amt.scrollIntoView({block:"center",behavior:"smooth"});
      setTimeout(()=>{const el=document.querySelector('.fillrow [data-amt="'+i+'"]');if(el)el.focus({preventScroll:true})},260);
    }else if(b){
      b.scrollIntoView({block:"center",behavior:"smooth"});
    }
  }
  const live=document.getElementById("live");
  if(live)live.textContent="已放入"+(bin==="bs"?"资产负债表":bin==="is"?"利润表":"现金流量表");
  save();
}
function gradeCard(){
  const c=S.deck[S.i], errs=[];
  const want=c.imp.map(x=>({b:x[0],k:x[1],sign:x[2]<0?-1:1,amt:Math.abs(x[2])}));
  const used=want.map(()=>false);
  S.placed.forEach(p=>{
    const pool=c._pool[p.c];
    const hit=want.findIndex((w,ix)=>!used[ix]&&w.k===pool.k&&w.b===p.bin);
    if(hit>=0){
      used[hit]=true;
      if(S.tableMode){
        const w=want[hit];
        if((p.sign||1)!==w.sign||Math.abs((parseFloat(p.amt)||0)-w.amt)>=0.011)
          errs.push(`「${pool.k}」应为 ${fmt(w.sign*w.amt)} 万元`);
      }
      return;
    }
    const sameLabel=want.findIndex((w,ix)=>!used[ix]&&w.k===pool.k);
    if(pool.imp&&sameLabel>=0){
      used[sameLabel]=true;
      errs.push(`「${pool.k}」放错表了，它属于${STN[pool.s]}`);
    }else{
      errs.push(`「${pool.k}」不该出现在这里——它是干扰项，这笔业务不影响这个科目`);
    }
  });
  want.forEach((w,ix)=>{if(!used[ix])errs.push(`漏了「${w.k}」${S.tableMode?`（应为 ${fmt(w.sign*w.amt)} 万元）`:""}`)});
  return errs;
}
function submit(){
  if(S.graded)return;
  if(!S.placed.length)return toast("先把科目放进表里，再交卷");
  const c=S.deck[S.i];
  const wasMastered=S.mastered.has(c.id);
  S.graded=true; S.sel=null;
  const errs=gradeCard();
  const bad=errs.length;
  S.flags[S.i]=bad===0;
  S.correct=S.flags.filter(x=>x===true).length;
  const matched=c.imp.filter(x=>S.placed.some(p=>{
    const q=c._pool[p.c];
    return p.bin===x[0]&&q.imp&&q.k===x[1]&&(!S.tableMode||((p.sign||1)===(x[2]<0?-1:1)&&Math.abs((parseFloat(p.amt)||0)-Math.abs(x[2]))<0.011));
  })).length;
  S.hits[S.i]=matched;
  S.hit=S.hits.reduce((a,b)=>a+b,0);
  if(!S.xpEarned.has(c.id)){
    S.xpEarned.add(c.id);
    S.xp+=matched*4;
  }
  if(bad===0){
    S.mastered.add(c.id);
    S.practiceWrong.delete(c.id);
    ["S","N","Q"].forEach(k=>{if(S.stats[k])S.stats[k].wrong=S.stats[k].wrong.filter(x=>x!==c.id)});
    S.combo++; S.best=Math.max(S.best,S.combo);
    if(!wasMastered)S.xp+=20*Math.min(S.combo,5);
    S.stamped=true;
    toast("连对 "+S.combo);
  }else{
    S.combo=0;
    if(S.mode!=="exam")S.practiceWrong.add(c.id);
    toast("对 "+matched+" 个 · 错 "+bad+" 处",true);
  }
  if(S.mode==="exam"&&S.exam){
    const st=S.stats[S.exam];
    if(bad===0)st.wrong=st.wrong.filter(x=>x!==c.id);
    else if(!st.wrong.includes(c.id))st.wrong.push(c.id);
  }
  S._justGraded=true; save();
  render();
}
const STN={bs:"资产负债表",is:"利润表",cf:"现金流量表"};
function renderFB(){
  const c=S.deck[S.i];
  const errors=gradeCard();
  const perfect=errors.length===0;
  const matched=c.imp.filter(x=>S.placed.some(p=>{
    const q=c._pool[p.c];
    return p.bin===x[0]&&q.imp&&q.k===x[1]&&(!S.tableMode||((p.sign||1)===(x[2]<0?-1:1)&&Math.abs((parseFloat(p.amt)||0)-Math.abs(x[2]))<0.011));
  })).length;
  const last=S.i>=S.deck.length-1;
  const lines=c.imp.map(x=>{
    const ok=S.placed.some(p=>{const q=c._pool[p.c];return p.bin===x[0]&&q.imp&&q.k===x[1]&&(!S.tableMode||((p.sign||1)===(x[2]<0?-1:1)&&Math.abs((parseFloat(p.amt)||0)-Math.abs(x[2]))<0.011))});
    return `<li class="${ok?"li-ok":"li-no"}">${ok?"✓":"✗"} <b class="mono">${fmt(x[2])}</b> ${x[1]} <span class="mono" style="color:var(--text3)">${STN[x[0]]}</span></li>`;

  }

        const left=S.flags.filter(x=>x===null).length;
        if(left&&!confirm(`还有 ${left} 题未作答，确定交卷？`))return;
        finishExam();
      }
      else{S.resume=null;S.screen="result";save();render()}
    }else{jumpTo(S.i+1);}
  };
  const ag=$("#again"); if(ag)ag.onclick=()=>{
    S.cardStates[S.i]=null;S.flags[S.i]=null;S.hits[S.i]=0;
    S.correct=S.flags.filter(v=>v===true).length;S.hit=S.hits.reduce((a,b)=>a+b,0);
    buildCard();save();render();
  };
}

function finishExam(){
  S.elapsed=freezeTimer();
  const st=S.stats[S.exam];
  const full=S.deck.length===EXAMS[S.exam].ids.length;
  st.hist=st.hist||[];
  st.hist.unshift({t:Date.now(),ok:S.correct,total:S.deck.length,ms:S.elapsed,full:full});
  st.hist=st.hist.slice(0,6);
  if(full){
    st.runs++;
    if(S.correct>st.best)st.best=S.correct;
    if(S.correct===S.deck.length&&(!st.ms||S.elapsed<st.ms))st.ms=S.elapsed;
  }
  S.resume=null;
  S.screen="bossend";
  save(); render();
}

       <table>${e.is.map(([n,v])=>`<tr class="${["营业利润","利润总额","净利润"].includes(n)?"tot":""}"><td>${n}</td><td>${v.toFixed(2)}</td></tr>`).join("")}</table>
       <div class="foot">营业利润 = 收入 − 成本 − 期间费用 + 公允价值变动；利润总额 = 营业利润 − 营业外支出；净利润 = 利润总额 × 75%。</div>
     </div>
     <div class="sheet">
       <h3>现金流量表 <span>2025 年度</span></h3>
       <table>${e.cf.map(([n,v])=>`<tr class="${/净额|净增加|期末现金/.test(n)?"tot":""}"><td>${n}</td><td>${v.toFixed(2)}</td></tr>`).join("")}</table>
     </div>
     <div class="sheet tinted">
       <h3>勾稽自检</h3>
       <div class="mono" style="font-size:13px;line-height:2.2;color:var(--text)">
         资产合计 <b>${e.bs.total.toFixed(2)}</b> = 负债和权益 <b>${e.bs.total.toFixed(2)}</b> <span class="check">✓</span><br>
         期末现金 <b>${e.cf[e.cf.length-1][1].toFixed(2)}</b> = 货币资金 <b>${e.bs.assets[0][1].toFixed(2)}</b> <span class="check">✓</span><br>
         净利润 <b>${e.is[e.is.length-1][1].toFixed(2)}</b> = 未分配利润 <b>${e.bs.eq[e.bs.eq.length-1][1].toFixed(2)}</b> <span class="check">✓</span>
       </div>
       <div class="foot">${e.note}</div>
     </div>
   </div>
   <div class="actions" style="margin-top:16px">
     ${S.mode==="exam"&&(S.stats[S.exam].wrong||[]).length?`<button class="btn primary" id="reWrong">重练错题 ${(S.stats[S.exam].wrong||[]).length} 笔</button>`:""}
     <button class="btn ${S.mode==="exam"&&S.stats[S.exam].wrong.length?"ghost":"primary"}" id="reExam">再练一遍</button>
     <button class="btn ghost" data-nav="guide">开卷速查</button>
     <div class="spacer"></div>
     <button class="btn ghost" data-nav="exam">真题列表</button>
   </div>`;
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav));
  const rw=$("#reWrong");
  if(rw)rw.onclick=()=>startDrill(S.stats[S.exam].wrong.slice(),S.exam,{tag:"wrong",table:true});
  $("#reExam").onclick=()=>startDrill(EXAMS[S.exam].ids,S.exam,{tag:"exam",table:true});
}

/* ---------- 开卷速查 ---------- */
function renderGuide(){
  $("#app").innerHTML=`
   <div class="top"><div class="brand">${LOGO}开卷速查</div>
     <div class="nav"><button data-nav="home">← 答题</button><button data-nav="num">数字快答</button><button id="printGuide">打印</button></div></div>
   <div class="kwchips" id="kwchips">${KEYWORDS.map(([label,q])=>`<button data-kw="${esc(q)}">${esc(label)}</button>`).join("")}</div>
   <div class="searchbar"><input id="q" type="search" aria-label="搜索科目或业务" placeholder="搜题干词：折旧 / 补助 / 预收 / 个税 / 视同销售"></div>
   <div class="guide" id="glist"></div>`;
  const inp=$("#q");
  inp.value=S.filter||"";
  const paint=()=>{
    const k=inp.value.trim().toLowerCase();
    const list=GUIDE.filter(g=>!k||[g.n,g.c,g.e,g.bs,g.is,g.cf,g.t].join(" ").toLowerCase().includes(k));
    $("#glist").innerHTML=list.map(g=>`<div class="g">
       <div class="gh"><b>${esc(g.n)}</b><span>${esc(g.c)}</span></div>
       <div class="entry">${esc(g.e)}</div>
       <div class="rows">
         <div class="b1"><b>资产负债表</b>${esc(g.bs)}</div>
         <div class="b2"><b>利润表</b>${esc(g.is)}</div>
         <div class="b3"><b>现金流量表</b>${esc(g.cf)}</div>
       </div>
       <div class="tip2">${esc(g.t)}</div>
       ${GUIDE_CARD[g.n]?`<button class="gbtn" data-card="${GUIDE_CARD[g.n]}">用这道练 →</button>`:""}
     </div>`).join("")||'<div class="g"><div class="gh"><b>没搜到</b><span>换个词</span></div><div class="entry">试试：折旧 · 补助 · 预收 · 个税 · 视同销售</div></div>';
    document.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>startDrill([b.dataset.card],null,{tag:"guide"}));
  };
  inp.addEventListener("input",()=>{S.filter=inp.value;paint()});
  document.querySelectorAll("[data-kw]").forEach(b=>b.onclick=()=>{
    inp.value=b.dataset.kw;S.filter=inp.value;paint();inp.focus();
  });
  const pb=$("#printGuide");if(pb)pb.onclick=()=>window.print();
  paint();
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav));
}

/* ---------- 关键词抢答 ---------- */
function renderQuiz(){
  const total=QUIZ.length;
  const q=QUIZ[S.quizI%total];
  const card=byId(q.cid);
  const opts=rnd([q.ans,...rnd(QUIZ_ANS.filter(a=>a!==q.ans)).slice(0,3)]);
  $("#app").innerHTML=`
   <div class="top"><div class="brand">${LOGO}关键词抢答</div>
     <div class="nav"><button data-nav="home">← 答题</button><button data-nav="guide">开卷速查</button></div></div>
   <div class="numbar">
   <div class="hud" style="margin-bottom:16px">
     <div class="k">答对 <b id="qdone">${S.quizSeen.size}/${total}</b></div>
     <div class="k">连对 <b id="qstreak">${S.quizStreak||0}</b></div>
     <div class="k">XP <b id="qxp">${S.xp}</b></div>
     <div class="k grow">第 ${(S.quizI%total)+1} / ${total} 题</div>
   </div>
   <div class="numcard" style="margin-top:0">
     <div class="qn">看题干词 · 认业务类型</div>
     <div class="kwprompt">${esc(q.kw)}</div>
     <p class="quizask">这笔业务属于哪一类？</p>
     <div class="quizopts" id="qopts">${opts.map((a,i)=>`<button data-opt="${i}" data-ans="${esc(a)}"><span class="qnum">${i+1}</span>${esc(a)}</button>`).join("")}</div>
     <div id="qfb" aria-live="polite"></div>
     <div class="actions" style="margin-top:16px">
       <button class="btn primary" id="qnext" disabled>下一题</button>
       <button class="btn ghost" id="qtrain" disabled>去练这道</button>
     </div>
   </div>
   </div>`;
  let locked=false;
  const qi=S.quizI%total;
  const choose=(ans)=>{
    if(locked)return; locked=true;
    const ok=ans===q.ans;
    if(ok){
      if(!S.quizSeen.has(qi)){S.quizSeen.add(qi);S.xp+=8}
      S.quizStreak=(S.quizStreak||0)+1;S.combo++;S.best=Math.max(S.best,S.combo);
      toast("对 · 连对 "+S.quizStreak);
    }else{S.quizStreak=0;S.combo=0;toast("答案是 "+q.ans,true)}
    save();
    $("#qdone").textContent=S.quizSeen.size+"/"+total;
    $("#qstreak").textContent=S.quizStreak||0;
    $("#qxp").textContent=S.xp;
    document.querySelectorAll("[data-opt]").forEach(b=>{
      b.disabled=true;
      if(b.dataset.ans===q.ans)b.classList.add("ok");
      else if(b.dataset.ans===ans)b.classList.add("no");
    });
    const rows=card?card.imp.map(x=>`<li>${STN[x[0]]} · ${esc(x[1])} <b class="mono">${fmt(x[2])}</b></li>`).join(""):"";
    $("#qfb").innerHTML=`<div class="fb ${ok?"":"bad"}"><h4>${ok?"答对了":"答案是："+esc(q.ans)}</h4>
      ${rows?`<ul>${rows}</ul>`:""}<div class="why">${card?esc(card.why):""}</div></div>`;
    $("#qnext").disabled=false; $("#qtrain").disabled=!card;
    $("#qnext").focus();
  };
  document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>choose(b.dataset.ans));
  $("#qnext").onclick=()=>{S.quizI++;save();renderQuiz()};
  $("#qtrain").onclick=()=>{if(card)startDrill([card.id],null,{tag:"guide"})};
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav));
}

/* ---------- 数字快答 ---------- */
function numBank(){
  const list=CARDS.filter(c=>c.num).map(c=>[c.num[0],c.num[1],c.num[2],c.prompt]);
  return list.concat(NUMEXTRA.map(x=>[x[0],x[1],x[2]]));
}
function renderNum(){
  const bank=numBank(); const q=bank[S.numIdx%bank.length];
  const [text,ans,hint,src]=q;
  const unit=/元\/件/.test(text)?"元/件":"万元";
  $("#app").innerHTML=`
   <div class="top"><div class="brand">${LOGO}数字快答</div>
     <div class="nav"><button data-nav="home">← 答题</button><button data-nav="guide">速查</button></div></div>
   <div class="numbar">
   <div class="hud" style="margin-bottom:16px">
     <div class="k">答对 <b id="numdone">${S.numSeen.size}</b></div>
     <div class="k">连对 <b id="numstreak">${S.numStreak||0}</b></div>
     <div class="k">XP <b id="numxp">${S.xp}</b></div>
     <div class="k grow">第 ${(S.numIdx%bank.length)+1} / ${bank.length} 题</div>
   </div>
   <div class="numcard" style="margin-top:0">
     <div class="qn">Q${String((S.numIdx%bank.length)+1).padStart(2,"0")} / ${bank.length}</div>
     ${src?`<div class="mono" style="font-size:11.5px;color:var(--text3);line-height:1.75;margin-bottom:16px;padding-left:12px;border-left:2px solid rgba(201,162,74,.45)">${esc(src)}</div>`:""}
     <div class="q">${esc(text)}</div>
     <div class="answer">
       <input id="ans" inputmode="decimal" aria-label="答案" placeholder="0.00" autocomplete="off">
       <span class="u">${unit}</span>
       <button class="btn primary" id="ok">对答案</button>
       <button class="btn ghost" id="nt" disabled>下一题</button>
     </div>
     <div class="streakbar">${[0,1,2,3,4].map(i=>`<i class="${i<(S.numStreak||0)?"on":""}"></i>`).join("")}</div>
     <div id="fb" style="margin-top:14px" aria-live="polite"></div>
   </div>
   </div>`;
  const inp=$("#ans"), okBtn=$("#ok"), ntBtn=$("#nt");
  const qi=S.numIdx%bank.length;
  let locked=false;
  const check=()=>{
    if(locked)return;
    const v=parseFloat(String(inp.value).replace(/[,，\s]/g,""));
    if(isNaN(v))return toast("先填个数字");
    locked=true;
    const ok=Math.abs(v-ans)<0.011;
    if(ok){
      if(!S.numSeen.has(qi)){S.numSeen.add(qi);S.xp+=8}
      S.numStreak=(S.numStreak||0)+1;S.combo++;S.best=Math.max(S.best,S.combo);
      toast("对 · 连对 "+S.numStreak);
    }else{S.numStreak=0;S.combo=0;toast("答案是 "+ans,true)}
    save();
    $("#numdone").textContent=S.numSeen.size;
    $("#numstreak").textContent=S.numStreak||0;
    $("#numxp").textContent=S.xp;
    inp.disabled=true; okBtn.disabled=true; ntBtn.disabled=false;
    $("#fb").innerHTML=`<div class="fb ${ok?"":"bad"}"><h4>${ok?"正确":"答案 "+ans+" "+unit}</h4><div class="why">${esc(hint)}</div></div>`;
    setTimeout(()=>ntBtn.focus(),30);
  };
  okBtn.onclick=check;
  inp.onkeydown=e=>{if(e.key==="Enter")check()};
  ntBtn.onclick=()=>{S.numIdx++;save();renderNum()};
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav));
  setTimeout(()=>inp.focus(),50);
}

/* ---------- 快捷键 ---------- */
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select"||e.target.isContentEditable)return;
  if(S.screen!=="play")return;
  const interactive=!!(e.target.closest&&e.target.closest('button,a,input,textarea,select,[role="button"],[data-bin],[data-chip]'));
  if(e.key===" "){
    if(interactive)return;
    e.preventDefault();
    if(!S.graded)submit();else{const b=$("#next");if(b)b.click()}
  }
  if(e.key==="Escape"){
    if(S.sel!==null){S.sel=null}
    else if(S.placed.length&&!S.graded){S.placed.pop()}
    render();
  }
  if(["1","2","3"].includes(e.key)&&S.sel!==null&&!S.graded){
    place(S.sel,["bs","is","cf"][+e.key-1]);
  }
});

render();
function bootHash(){
  const h=location.hash.replace('#','');
  if(S.screen==='play')return;
  if(S.resume&&(h==='drill'||h==='boss')){S.screen='home';render();return}
  stopTimer();
  if(h==='drill')startPractice(CARDS.map(c=>c.id),"drill","分拣练习",10);
  else if(h==='boss')startDrill(EXAMS.S.ids,"S",{tag:"exam",table:true});
  else if(h==='exam'){S.screen='exam';render()}
  else if(h==='guide'){S.screen='guide';render()}
  else if(h==='num'){S.screen='num';render()}
  else if(h==='quiz'){S.screen='quiz';render()}
  else {S.screen='home';render()}
}
bootHash();
window.addEventListener('hashchange',bootHash);
window.addEventListener("pagehide",()=>{if(S.screen==="play")save()});
initCloud();
initOnline();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&S.screen==="play")save()});
</script>
